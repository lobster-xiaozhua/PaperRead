name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明你在什么场景下遇到什么不便
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的功能形态（可附草图或同类应用参考）
    validations:
      required: true

  - type: dropdown
    id: offline
    attributes:
      label: 是否需要联网
      description: 本项目红线是零网络权限，联网类需求需要特别说明
      options:
        - 完全离线（不引入网络）
        - 仅在用户主动触发的局域网场景（如 Wi-Fi 传书）
        - 需要外网（与项目红线冲突，需讨论）
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 替代方案 / 已有 workaround
    validations:
      required: false
