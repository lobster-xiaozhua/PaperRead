name: Android CI

on:
  push:
    branches: [main]
    # 纯文档变更（md / docs/）不影响构建与测试，跳过 CI 节省 runner 分钟
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 最小权限：CI 只需读代码，不写仓库
permissions:
  contents: read

# 同一 ref 的新推送取消仍在跑的旧运行，节省 runner 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 门禁拆分为七个独立作业（T-001 · R-03 / R-09；T-006 · R-06；T-009 · R-02 增量接入；T-008 · R-07 增补 r8-smoke）：
#   unit          双 flavor 单元测试 + 覆盖率门禁（client 变体口径）
#   robolectric-ui UI 冒烟独立作业 + 失败重试 ≤ 1（G9：Robolectric 渲染在
#                 内存受限环境有抖动，隔离出不阻塞主测试门禁）
#   lint          Android lint + 文档口径一致性脚本（G3）
#   room-migration Room 迁移登记检查（G6：version+1 必须登记迁移 +
#                 destructive fallback 禁用，纯 bash 断言，无需 JDK/SDK）
#   network-audit 网络行为断言（G2①：不访问公网 / 无三方网络 SDK /
#                 网络行为收敛于 transfer/，纯 bash 断言，无需 JDK/SDK）
#   assemble      双 flavor 装配（client 交付版 + dev 调试版）
#   r8-smoke      release/R8 运行时冒烟（T-008 · R-07 / G7，架构 §6.2 方案 B：
#                 assembleClientRelease → mapping keep 静态断言 → clientRelease
#                 变体序列化 round-trip；真机 install smoke 步骤以注释预留，
#                 需 KVM runner）
# 拆分代价是各作业各自支付一次配置阶段（AGP + KSP + Room + Compose，约 10s），
# 换取失败定位清晰与 flaky 隔离；多作业并行执行，总时长不劣于原单作业。
# room-migration 与 network-audit 为纯脚本作业（checkout 后直接跑 bash，
# 无构建配置成本）。
jobs:
  # 门禁一：单元测试 + 覆盖率（client 变体口径）。
  # ui/smoke 冒烟在内存受限 runner 上存在 Robolectric 渲染超时抖动（已知基线
  # 现象，非回归），经 -PexcludeUiSmokeTests=true 移交 robolectric-ui 作业，
  # 不阻塞本门禁；本地构建不传该属性，全量照跑。
  # 覆盖率口径：**逻辑层**行覆盖率 ≥ 80%。纯 Compose 渲染类（*ScreenKt /
  # *SheetKt / *DialogKt / *PanelKt / *SpreadKt / *NavHostKt / ThemeKt）不计入
  # 分母——它们只由本作业排除掉的 ui.smoke 覆盖，计入分母等于拿 robolectric-ui
  # 的成绩给本作业充值（且是唯一允许重试的那份成绩）。规则与实测见
  # app/build.gradle.kts 的 coverageClassExcludes 注释。
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 供应链安全：校验 Gradle wrapper JAR 未被篡改
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Robolectric 在测试运行时才从 Maven Central 拉 android-all jar 到
      # ~/.m2/repository（setup-gradle 只覆盖 ~/.gradle，该目录不在其缓存范围）。
      # 全量约 335MB：API 34（测试运行 SDK，@Config(sdk=[34])）+
      # API 35（compileSdk，AndroidTestEnvironment.loadAppPackage 必需）。
      # 不缓存则每轮 CI 重复下载；key 带 libs.versions.toml 哈希，
      # Robolectric 版本变更时自动换 key 重新下载，restore-keys 兜底复用旧条目
      # （jar 路径内嵌 Robolectric 版本号，旧条目不会被误用）。
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 镜像自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：其默认 packages 含已废弃的 'tools' 包，
      # sdkmanager 找不到该包即整步失败（Failed to find package 'tools'）
      - name: Set up Android SDK
        run: |
          set -e
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # flavor 口径（2026-10-18 分发形态调整）：两个 flavor 的测试都跑——
      # client 为唯一对外交付版（jacoco 覆盖率门禁经 dependsOn 绑定其测试），
      # dev 为调试版（applicationId 后缀 + IS_DEBUG_BUILD 标记，与 client
      # 同源代码，供同机安装自测与调试能力分流；AGP 不允许 flavor 与 build
      # type 同名，故调试版 flavor 取名 dev，变体为 devDebug）。
      # Release 门禁保留：R8 混淆 + 资源压缩只在发布路径生效，由 assemble
      # 作业的 assembleRelease 覆盖（混淆规则缺失 / keep 漏写要等到发版前才暴露；
      # 不配置签名，keystore 不入库，产出未签名 APK，仅验证能正常打包）。
      - name: Unit tests + coverage (excl. UI smoke)
        run: >
          ./gradlew
          testClientDebugUnitTest
          testDevDebugUnitTest
          jacocoTestReport
          jacocoTestCoverageVerification
          -PexcludeUiSmokeTests=true
          --console=plain

      # 覆盖率报告（HTML/XML），可下载查看
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperread-coverage-report
          path: app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      # 失败时上传测试报告，便于下载排查（含失败断言与堆栈）
      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paperread-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # 门禁二：Robolectric UI 冒烟独立作业（G9 机制就位）。
  # 抖动重试至多 1 次（attempt 上限 2）：重试后仍失败才判红——
  # 连续 20 次绿后（T-026 收口时评估）可恢复并入 unit 门禁。
  robolectric-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Robolectric UI smoke (retry <= 1)
        run: |
          attempt=1
          until ./gradlew testClientDebugUnitTest --tests "io.github.lunalight.paperread.ui.smoke.*" --console=plain; do
            if [ "$attempt" -ge 2 ]; then
              echo "::error::Robolectric UI 冒烟重试一次后仍失败"
              exit 1
            fi
            echo "::warning::Robolectric UI 冒烟第 ${attempt} 次失败，重试一次（G9 抖动隔离）"
            attempt=$((attempt + 1))
          done

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paperread-ui-smoke-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # 门禁三：Android lint + 文档口径一致性（G3：权限表述 / 覆盖率口径 /
  # Kotlin 版本单一来源，由 scripts/check-doc-consistency.sh 断言）。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Doc consistency (permissions / coverage / Kotlin version / test count / CI jobs)
        run: ./scripts/check-doc-consistency.sh

      - name: Android lint
        run: ./gradlew lint --console=plain

  # 门禁四：Room 迁移登记检查（T-006 · R-06 / G6）。
  # 纯 bash 静态断言，不依赖 JDK / Android SDK：version 与 schemas/
  # 目录、迁移登记（autoMigrations / MIGRATIONS）三者一致；
  # fallbackToDestructiveMigration 保持禁用；迁移测试夹具与导出同步。
  # 放在 lint 与 assemble 之间：数据层 schema 演进是升级崩溃的头号
  # 来源，值得一个独立可见的门禁，失败时定位到「谁改了 schema 没登记」。
  room-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Room migration registration (G6)
        run: ./scripts/check-room-migration.sh

  # 门禁五：网络行为断言（T-009 · R-02 / AC-20.5 / G2①）。
  # 隐私页对用户承诺「不访问公网」，本作业把该承诺固化为 CI 断言：
  # URL 字面量白名单（白名单外零 endpoint）、socket API 收敛于
  # transfer/、三方网络 / 统计 SDK 禁入、构建配置 URL 仅限依赖解析。
  # 纯 bash 静态断言，不依赖 JDK / Android SDK；与 privacy 页同源，
  # 审计口径公开于 docs/NETWORK_AUDIT.md。
  network-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Network behavior audit (G2)
        run: ./scripts/check-network-behavior.sh

  # 门禁六：双 flavor 装配（client 正式版 + dev 调试版；含 release 打包路径）。
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug + release (R8)
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: paperread-client-debug-apk
          path: app/build/outputs/apk/client/debug/app-client-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: paperread-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14

  # 门禁七：release / R8 运行时冒烟（T-008 · R-07 / G7）。
  #
  # 采用架构设计 §6.2 的**方案 B**（退化方案）：本 runner 无 KVM，模拟器起不来、
  # instrumented 测试跑不了，为彻底规避 androidx.test 依赖，把「R8 后的运行时
  # 冒烟」拆成两件可执行的事：
  #   1. `assembleClientRelease`：R8 混淆 + 资源收缩全开，产物与发版一致；
  #   2. `scripts/check-r8-keep.sh`：断言 mapping.txt 中序列化契约类型 /
  #      `$$serializer` / ImportError 子类均在产物中（静态断言）；
  #   3. `testClientReleaseUnitTest`：release 变体下跑 `quality.*`
  #      （ReleaseSerializationTest，全部序列化对象 round-trip）。
  # 代价（明确记录）：三者都不覆盖「混淆后的真实运行时行为」，该缺口归
  # 真机 install smoke（下方注释预留，需 KVM runner）。
  r8-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Robolectric jar 缓存：ReleaseSerializationTest 本身不依赖 Robolectric，
      # 但 testClientReleaseUnitTest 的变体配置仍需 android-all（资源合并）。
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # R8 是内存大户：与 unit 作业分开跑，避免同一 JVM 里叠加 Kotlin/Robolectric 峰值
      - name: Assemble clientRelease (R8 + resource shrinking)
        run: ./gradlew assembleClientRelease --console=plain

      - name: R8 keep assertions (mapping.txt)
        run: ./scripts/check-r8-keep.sh

      # release 变体单测已在 app/build.gradle.kts 收窄到 quality.*：
      # 只跑序列化契约 round-trip，不被 debug 口径的既有断言拖累。
      - name: Release variant serialization round-trip
        run: ./gradlew testClientReleaseUnitTest --console=plain

      - name: Upload R8 mapping + usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperread-r8-mapping
          path: |
            app/build/outputs/mapping/clientRelease/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paperread-r8-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ---- 以下为**预留**步骤：需 KVM runner（ubuntu-latest 无 KVM，模拟器起不来）----
      # 在有 KVM 的自托管 runner 上启用后，G7 才具备「运行时」覆盖；
      # 在此之前 G7 的结论口径是「静态断言 + release 变体单测全绿」，
      # 真机 install smoke 见 docs/DEVICE_CHECKLIST.md §0/§7。
      #
      # - name: Enable KVM
      #   run: |
      #     echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
      #       | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      #     sudo udevadm control --reload-rules
      #     sudo udevadm trigger --name-match=kvm
      #
      # - name: Run instrumented smoke on emulator (needs KVM runner)
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 34
      #     target: google_apis
      #     arch: x86_64
      #     disable-animations: true
      #     script: |
      #       # 安装 clientRelease（已签名方可 install；本仓库不存 keystore，
      #       # 由 CI secrets 注入 RELEASE_STORE_FILE 等四个属性后重签）
      #       adb install -r app/build/outputs/apk/client/release/app-client-release-unsigned.apk \
      #         || adb install -r app/build/outputs/apk/client/release/app-client-release.apk
      #       adb shell am instrument -w \
      #         io.github.lunalight.paperread.test/androidx.test.runner.AndroidJUnitRunner

